<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="fill">
    <rect x="80" y="140" width="240" height="80" rx="14" fill="#FF5722"/>
    <rect x="120" y="100" width="60" height="50" rx="6" fill="#FF7043"/>
    <line x1="170" y1="100" x2="220" y2="60" stroke="#222" stroke-width="6"/>
    <line x1="200" y1="60" x2="240" y2="60" stroke="#222" stroke-width="5"/>
    <circle cx="100" cy="240" r="35" fill="#3a3a3a"/>
    <circle cx="300" cy="240" r="35" fill="#3a3a3a"/>
    <circle cx="100" cy="240" r="15" fill="#888"/>
    <circle cx="300" cy="240" r="15" fill="#888"/>
  </g>
  <g id="outline">
    <rect x="80" y="140" width="240" height="80" rx="14" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="120" y="100" width="60" height="50" rx="6" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="170" y1="100" x2="220" y2="60" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="60" x2="240" y2="60" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="240" r="35" fill="none" stroke="#1F1F1F" stroke-width="3"/>
    <circle cx="300" cy="240" r="35" fill="none" stroke="#1F1F1F" stroke-width="3"/>
    <circle cx="100" cy="240" r="15" fill="none" stroke="#1F1F1F" stroke-width="2"/>
    <circle cx="300" cy="240" r="15" fill="none" stroke="#1F1F1F" stroke-width="2"/>
  </g>
