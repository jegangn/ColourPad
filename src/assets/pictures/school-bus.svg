<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="fill">
    <rect x="40" y="100" width="320" height="130" rx="14" fill="#FFD600"/>
    <rect x="60" y="120" width="60" height="50" rx="4" fill="#bde0fe"/>
    <rect x="135" y="120" width="60" height="50" rx="4" fill="#bde0fe"/>
    <rect x="210" y="120" width="60" height="50" rx="4" fill="#bde0fe"/>
    <rect x="285" y="120" width="60" height="50" rx="4" fill="#bde0fe"/>
    <rect x="40" y="200" width="320" height="14" fill="#1F1F1F"/>
    <circle cx="100" cy="230" r="28" fill="#3a3a3a"/>
    <circle cx="300" cy="230" r="28" fill="#3a3a3a"/>
    <circle cx="100" cy="230" r="14" fill="#888"/>
    <circle cx="300" cy="230" r="14" fill="#888"/>
  </g>
  <g id="outline">
    <rect x="40" y="100" width="320" height="130" rx="14" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="120" width="60" height="50" rx="4" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="135" y="120" width="60" height="50" rx="4" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="210" y="120" width="60" height="50" rx="4" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="285" y="120" width="60" height="50" rx="4" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="200" x2="360" y2="200" stroke="#1F1F1F" stroke-width="3"/>
    <circle cx="100" cy="230" r="28" fill="none" stroke="#1F1F1F" stroke-width="3"/>
    <circle cx="300" cy="230" r="28" fill="none" stroke="#1F1F1F" stroke-width="3"/>
  </g>
