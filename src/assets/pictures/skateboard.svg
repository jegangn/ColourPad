<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="fill">
    <!-- deck -->
    <rect x="80" y="145" width="240" height="22" rx="10" fill="#e74c3c"/>
    <!-- grip tape stripe -->
    <rect x="85" y="148" width="230" height="10" rx="4" fill="#c0392b"/>
    <!-- front truck -->
    <rect x="270" y="167" width="35" height="8" rx="3" fill="#7f8c8d"/>
    <!-- rear truck -->
    <rect x="95" y="167" width="35" height="8" rx="3" fill="#7f8c8d"/>
    <!-- wheels -->
    <circle cx="110" cy="180" r="12" fill="#3a3a3a"/>
    <circle cx="290" cy="180" r="12" fill="#3a3a3a"/>
    <circle cx="125" cy="180" r="12" fill="#3a3a3a"/>
    <circle cx="275" cy="180" r="12" fill="#3a3a3a"/>
  </g>
  <g id="outline">
    <!-- deck -->
    <rect x="80" y="145" width="240" height="22" rx="10" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- front truck -->
    <rect x="270" y="167" width="35" height="8" rx="3" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- rear truck -->
    <rect x="95" y="167" width="35" height="8" rx="3" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- wheels -->
    <circle cx="110" cy="180" r="12" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="290" cy="180" r="12" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="125" cy="180" r="12" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="275" cy="180" r="12" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
